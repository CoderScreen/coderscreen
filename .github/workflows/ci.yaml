name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Scratch database for the API integration tests. Password auth is enforced
    # so the wrong-password test means something.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install global packages
        run: pnpm install -g tsup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Push schema to the scratch database
        run: pnpm --filter @coderscreen/db exec drizzle-kit push --force
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
          VITE_API_URL: http://localhost:8000
